<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Password — SE2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="mx-auto h-14 w-14 rounded-xl bg-blue-700 text-white flex items-center justify-center font-extrabold text-xl">BPS</div>
      <h1 class="mt-3 text-xl font-bold text-slate-900">Lupa Password</h1>
    </div>
    <div class="bg-white rounded-xl shadow-md p-6 sm:p-8">
      <p class="text-sm text-slate-500 mb-5">Masukkan email Anda. Bila terdaftar, sistem membuat link reset (untuk simulasi, link ditampilkan di konsol server).</p>
      <div id="msg" class="hidden mb-4 rounded-lg px-4 py-3 text-sm font-medium"></div>
      <form id="form" class="space-y-4">
        <input name="email" type="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="nama@bps.go.id" />
        <button type="submit" class="w-full rounded-lg bg-blue-700 px-4 py-2.5 text-sm font-bold text-white hover:bg-blue-800 transition">Kirim Link Reset</button>
      </form>
      <p class="text-center text-sm text-slate-500 mt-6"><a href="/login" class="text-blue-700 font-semibold hover:underline">Kembali ke Login</a></p>
    </div>
  </div>
  <script>
    const form = document.getElementById('form'), msg = document.getElementById('msg');
    function show(t, ok){ msg.textContent=t; msg.className='mb-4 rounded-lg px-4 py-3 text-sm font-medium '+(ok?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'); msg.classList.remove('hidden'); }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch('/forgot', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
        const j = await res.json();
        show(j.message || 'Permintaan diproses.', true);
      } catch (err) { show('Terjadi kesalahan jaringan.', false); }
    });
  </script>
</body>
</html>
