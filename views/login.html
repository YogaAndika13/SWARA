<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SE2026 Quality Assurance System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="mx-auto h-14 w-14 rounded-xl bg-blue-700 text-white flex items-center justify-center font-extrabold text-xl">BPS</div>
      <h1 class="mt-3 text-xl font-bold text-slate-900">SE2026 Quality Assurance</h1>
      <p class="text-sm text-slate-500">BPS Kabupaten Karangasem</p>
    </div>

    <div class="bg-white rounded-xl shadow-md p-6 sm:p-8">
      <h2 class="text-lg font-bold text-slate-900 mb-1">Masuk</h2>
      <p class="text-sm text-slate-500 mb-5">Silakan login untuk mengakses dashboard.</p>

      <div id="msg" class="hidden mb-4 rounded-lg px-4 py-3 text-sm font-medium"></div>

      <form id="form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input name="email" type="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="nama@bps.go.id" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-sm font-medium text-slate-700">Password</label>
            <a href="/forgot" class="text-xs text-blue-700 hover:underline">Lupa password?</a>
          </div>
          <input name="password" type="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="••••••••" />
        </div>
        <button type="submit" class="w-full rounded-lg bg-blue-700 px-4 py-2.5 text-sm font-bold text-white hover:bg-blue-800 transition">Masuk</button>
      </form>

      <div class="flex items-center gap-3 my-5">
        <div class="h-px bg-slate-200 flex-1"></div>
        <span class="text-xs text-slate-400">atau</span>
        <div class="h-px bg-slate-200 flex-1"></div>
      </div>

      <a href="/auth/google" class="w-full inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition">
        <svg class="h-4 w-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 010-4.2V7.06H2.18a11 11 0 000 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
        Masuk dengan Google
      </a>

      <p class="text-center text-sm text-slate-500 mt-6">Belum punya akun? <a href="/signup" class="text-blue-700 font-semibold hover:underline">Daftar di sini</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    function show(text, ok) {
      msg.textContent = text;
      msg.className = 'mb-4 rounded-lg px-4 py-3 text-sm font-medium ' + (ok ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700');
      msg.classList.remove('hidden');
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const j = await res.json();
        if (!res.ok) return show(j.error || 'Login gagal.', false);
        window.location = j.redirect || '/';
      } catch (err) { show('Terjadi kesalahan jaringan.', false); }
    });
  </script>
</body>
</html>
